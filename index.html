<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgentShield KYA</title>
<style>
:root{--bg:#f3f6f6;--card:#fff;--tx:#13201f;--mut:#566a68;--pri:#0f766e;--prit:#fff;--acc:#b45309;--bd:#d6e0df;--ok:#15803d;--bad:#b91c1c;--wn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1514;--card:#152120;--tx:#e5eeed;--mut:#9ab0ae;--pri:#2dd4bf;--prit:#04201d;--acc:#fbbf24;--bd:#2a3c3a;--ok:#4ade80;--bad:#f87171;--wn:#fbbf24}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1514;--card:#152120;--tx:#e5eeed;--mut:#9ab0ae;--pri:#2dd4bf;--prit:#04201d;--acc:#fbbf24;--bd:#2a3c3a;--ok:#4ade80;--bad:#f87171;--wn:#fbbf24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px}
.logo{font-weight:700;font-size:17px;color:var(--pri);margin-right:6px}
nav{display:flex;flex-wrap:wrap;gap:2px;flex:1}
.nv{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:8px;min-height:40px;font:inherit;cursor:pointer}
.nv.on{background:var(--pri);color:var(--prit)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;max-width:1200px;margin:0 auto;padding:16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:16px}h4{margin:14px 0 6px;font-size:14px}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.card b{display:block;font-size:26px;color:var(--pri)}.card.acc b{color:var(--acc)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;min-height:40px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
button{font:inherit;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--pri);background:transparent;color:var(--pri);cursor:pointer}
button.p{background:var(--pri);color:var(--prit)}button.d{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;cursor:pointer;min-height:52px}
.row2:hover{border-color:var(--pri)}.row2 .m{flex:1;min-width:140px}
.m{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:13px;margin-top:6px}
.empty{border:1px dashed var(--bd);border-radius:10px;padding:22px;text-align:center;color:var(--mut)}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ALLOW,.Registered{color:var(--ok)}.REJECT,.Revoked{color:var(--bad)}.HOLD,.FLAG{color:var(--wn)}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.fr{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tl{border-left:2px solid var(--bd);margin:8px 0 8px 6px;padding-left:12px}.tl div{margin-bottom:6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
.sc{font-weight:700;min-width:28px}.sc-w{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style></head><body>
<header><span class="logo">AgentShield KYA</span><nav id="nav" aria-label="Main"></nav>
<label style="display:flex;align-items:center;gap:6px">Role<select id="role" onchange="S.role=this.value;render()" style="width:auto;margin:0"><option>Consumer<option>Bank Admin<option>Operator</select></label></header>
<div class="wrap"><main id="main"></main><aside id="rail" aria-live="polite"></aside></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'₹'+Number(n).toLocaleString('en-IN'),rnd=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x)),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const S={agents:[],mand:{},txs:[],inc:[],view:'home',sel:null,role:'Consumer',th:{hi:45,med:25},nonces:new Set(),chain:'0000000000000000',ver:1,metrics:null,ledger:{},n:0,gf:'all',out:''};
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));
async function genKey(){const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const raw=await crypto.subtle.exportKey('raw',k.publicKey);return{k,fp:(await sha(raw)).slice(0,16).match(/.{4}/g).join(':')}}
const sign=(k,m)=>crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k.privateKey,enc.encode(m)),verify=(k,s,m)=>crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k.publicKey,s,enc.encode(m));
/* Isolation Forest */
const cn=n=>n<=1?0:2*(Math.log(n-1)+.5772)-2*(n-1)/n;
function build(X,d){if(d>=6||X.length<=1)return{n:X.length};const f=Math.floor(Math.random()*X[0].length),v=X.map(x=>x[f]),mn=Math.min(...v),mx=Math.max(...v);if(mn==mx)return{n:X.length};const p=rnd(mn,mx);return{f,p,l:build(X.filter(x=>x[f]<p),d+1),r:build(X.filter(x=>x[f]>=p),d+1)}}
const path=(t,x,d=0)=>t.n!==undefined?d+cn(t.n):path(x[t.f]<t.p?t.l:t.r,x,d+1);
const iso=(F,x)=>Math.pow(2,-F.reduce((a,t)=>a+path(t,x),0)/F.length/cn(48));
const normal=()=>[rnd(.12,.48),rnd(8,20)/24,Math.random()<.06?1:0];
const train=()=>{const X=Array.from({length:60},normal);return Array.from({length:60},()=>build(X.slice().sort(()=>Math.random()-.5).slice(0,48),0))};
function evalModel(){const F=train();let tp=0,fp=0,fn=0,tn=0;for(let i=0;i<300;i++){const bad=i%5==0,x=bad?[rnd(.8,1.2),(Math.random()<.5?rnd(0,5):rnd(21,24))/24,Math.random()<.7?1:0]:normal(),p=iso(F,x)>.6;bad?(p?tp++:fn++):(p?fp++:tn++)}const pr=tp/(tp+fp||1),rc=tp/(tp+fn);return{pr,rc,f1:2*pr*rc/((pr+rc)||1),fpr:fp/(fp+tn||1),n:300}}
/* Engine */
function mk(a,perTxn,daily,merchants,from,to){S.mand[a.id]={perTxn,daily,merchants,from,to,active:true,forest:train()};a.seen=merchants.slice(0,2)}
async function submit(aid,merchant,amount,hour){
const t0=performance.now(),a=S.agents.find(x=>x.id==aid),name=a?a.name:'Unknown-Agent',nonce=Math.random().toString(36).slice(2);
const msg=JSON.stringify({a:name,m:merchant,x:amount,h:hour,n:nonce});
const sig=await sign(a?a.keys:(await genKey()).k,msg);let idErr=null;
if(!a)idErr='Unauthenticated agent: not registered with this institution';
else if(a.status!=='Registered')idErr='Agent key has been revoked';
else if(S.nonces.has(nonce)||!(await verify(a.keys,sig,msg)))idErr='Signature invalid or request replayed';
S.nonces.add(nonce);
const m=a&&S.mand[a.id],spent=a?(S.ledger[a.id]||0):0,viol=[],fac=[];let score=0,an=0;
if(!idErr){
 if(!m||!m.active)viol.push('No active mandate for this agent');
 else{
  if(amount>m.perTxn)viol.push(`Amount ${R(amount)} exceeds the per-transaction limit of ${R(m.perTxn)}`);
  if(!m.merchants.some(x=>x.toLowerCase()==merchant.toLowerCase()))viol.push(`Merchant “${merchant}” is not on the allowed list`);
  if(hour<m.from||hour>=m.to)viol.push(`${hour}:00 is outside the ${m.from}:00 to ${m.to}:00 window`);
  if(spent+amount>m.daily)viol.push(`Would exceed the daily budget (${R(spent)} used of ${R(m.daily)})`);
 }}
if(idErr){score=100;fac.push(['Identity integrity failed',100])}
else{
 if(viol.length){score+=65;fac.push(['Mandate violation',65])}
 if(m){const novel=a.seen.includes(merchant)?0:1,ratio=amount/(.3*m.perTxn);
  an=clamp((iso(m.forest,[amount/m.perTxn,hour/24,novel])-.5)/.2);
  const ap=Math.round(an*40);if(ap>=5)fac.push([`Anomaly model (Isolation Forest v${S.ver})`,ap]);score+=ap;
  if(novel&&!viol.length){fac.push(['New merchant for this agent',10]);score+=10}
  if(ratio>3){fac.push([`Amount ${ratio.toFixed(1)}× usual`,10]);score+=10}
  if(hour<8||hour>20){fac.push(['Unusual time of day',5]);score+=5}
  if(spent+amount>.8*m.daily&&spent+amount<=m.daily){fac.push(['Cumulative budget nearly used',10]);score+=10}}
 score=Math.min(100,score)}
let d,why;
if(idErr){d='REJECT';why=idErr}else if(viol.length){d='REJECT';why=viol[0]}
else if(score>=S.th.hi){d='HOLD';why=`Risk score ${score} is at or above the step-up threshold (${S.th.hi}). Waiting for customer approval.`}
else{d='ALLOW';why=score>=S.th.med?'Within mandate but unusual. Allowed and flagged for review.':'Verified agent, within mandate, low anomaly.'}
const flag=d=='ALLOW'&&score>=S.th.med;
if(d=='ALLOW'){S.ledger[a.id]=spent+amount;if(!a.seen.includes(merchant))a.seen.push(merchant)}
const lat=Math.round(performance.now()-t0),id=S.txs.length+1;
const aud=['Signed request received',idErr?`Signature check failed: ${idErr}`:'Signature verified against registered public key',
 idErr?'Mandate checks skipped':(viol.length?'Mandate checks failed: '+viol.join('; '):'All hard rules passed'),
 `Risk score ${score}/100`,`Decision: ${d}. ${why}`,'Decision packet sent to bank gateway (simulated)'];
const tx={id,aid:a?a.id:null,agent:name,fp:a?a.fp:'none',merchant,amount,hour,decision:d,why,score,band:score>=S.th.hi?'High':score>=S.th.med?'Medium':'Low',fac,viol,flag,sigOK:!idErr,lat,aud,final:null,t:new Date().toLocaleTimeString()};
tx.hash=(await sha(S.chain+JSON.stringify([id,name,amount,merchant,d,score]))).slice(0,16);S.chain=tx.hash;
S.txs.push(tx);
if(d!='ALLOW'||flag){const tags=[];if(idErr)tags.push('Agent impersonation');if(viol.length)tags.push('Mandate violation');if(an>.3||d=='HOLD')tags.push('Anomaly');if(!tags.length)tags.push('Anomaly');
 S.inc.push({id:S.inc.length+1,tx:id,tags,rem:idErr?'Revoke the agent and rotate keys if it should exist.':viol.length?'Tighten or review the mandate; check the agent’s instructions.':'Review the request and approve or reject it.'})}
render();return tx}
/* Views */
const b=s=>`<span class="b ${s}">${s}</span>`;
const sumText=m=>`Hard rules: max ${R(m.perTxn)} per transaction, ${R(m.daily)} per day, merchants ${m.merchants.map(esc).join(', ')}, active ${m.from}:00 to ${m.to}:00. Risk policy: hold for step-up at score ${S.th.hi} or higher.`;
const txRow=t=>`<div class="row2" onclick="pick('tx',${t.id})"><b>#${t.id}</b><span class="m">${esc(t.agent)}, ${R(t.amount)} at ${esc(t.merchant)}</span><span class="sc">${t.score}</span>${b(t.decision)}${t.flag?b('FLAG'):''}</div>`;
const V={};
V.home=()=>{const held=S.txs.filter(t=>t.decision=='HOLD'&&!t.final).length;
return `<h2>Dashboard</h2><div class="cards"><div class="card"><b>${S.agents.filter(a=>a.status=='Registered').length}</b>Active agents</div><div class="card ${held?'acc':''}"><b>${held}</b>Held requests</div><div class="card"><b>${S.inc.length}</b>Incidents</div><div class="card"><b>${S.txs.length}</b>Transactions</div></div>
<div class="row"><button class="p" onclick="demo()">Run guided demo</button><button onclick="go('agents')">Add agent</button></div>
${S.agents.length?'':`<div class="box"><h3>Get started</h3><ol><li>Register your first AI agent</li><li>Create its mandate</li><li>Send requests in the sandbox</li></ol><p class="m">Or run the guided demo: it registers an agent, sets a ₹5,000 mandate and plays four requests.</p></div>`}
${held?`<h3>Needs your approval</h3>`+S.txs.filter(t=>t.decision=='HOLD'&&!t.final).map(txRow).join(''):''}
<h3>Your agents</h3>${S.agents.map(agentRow).join('')||'<div class="empty">No agents yet</div>'}`};
const agentRow=a=>`<div class="row2" onclick="pick('agent',${a.id})"><b>${esc(a.name)}</b><span class="m">${a.type}, ${a.fp}</span>${b(a.status)}</div>`;
V.agents=()=>`<h2>Agents</h2><div class="box"><h3>Add agent</h3><div class="f"><label>Agent name<input id="an" placeholder="ShopperBot"></label><label>Agent type<select id="at"><option>Shopping<option>Banking<option>Travel/Business</select></label></div><p class="m">A P-256 key pair is generated in your browser. Only the public identity is registered.</p><button class="p" onclick="addAgent()">Register agent</button><div id="err" class="err"></div></div>${S.agents.map(agentRow).join('')||`<div class="empty">No agents yet<br><br><button class="p" onclick="document.getElementById('an').focus()">Register your first AI agent</button></div>`}`;
async function addAgent(){const n=$('#an').value.trim(),e=m=>$('#err').textContent=m;
if(!n)return e('Enter an agent name.');if(S.agents.some(a=>a.name.toLowerCase()==n.toLowerCase()))return e('An agent with this name already exists. Choose a different name.');
try{const k=await genKey(),a={id:++S.n,name:n,type:$('#at').value,keys:k.k,fp:k.fp,status:'Registered',seen:[]};S.agents.push(a);S.mAgent=a.id;S.view='mand';pick('agent',a.id)}catch(x){e('Key generation failed. Retry in a secure (https) browser tab.')}}
V.mand=()=>{const a=S.agents.find(x=>x.id==S.mAgent)||S.agents[0];
if(!a)return `<h2>Mandates</h2><div class="empty">Register an agent before creating a mandate.<br><br><button class="p" onclick="go('agents')">Add agent</button></div>`;const m=S.mand[a.id];
return `<h2>Mandates</h2><label>Agent<select onchange="S.mAgent=+this.value;render()">${S.agents.map(x=>`<option value="${x.id}" ${x.id==a.id?'selected':''}>${esc(x.name)}`).join('')}</select></label><br>
<div class="box"><h3>Control mandate</h3><div class="f"><label>Per-transaction limit (₹)<input id="mp" type="number" value="5000"></label><label>Daily budget (₹)<input id="md" type="number" value="15000"></label><label>Allowed merchants, comma separated<input id="mm" value="Amazon Fresh, Uber, IRCTC, Swiggy"></label><label>From hour<input id="mf" type="number" value="6"></label><label>To hour<input id="mt" type="number" value="23"></label></div><button class="p" onclick="publish(${a.id})">Publish mandate</button><div id="err" class="err"></div></div>
${m?`<div class="box"><h3>Active mandate for ${esc(a.name)}</h3><p>${sumText(m)}</p><button class="d" onclick="S.mand[${a.id}].active=false;render()" ${m.active?'':'disabled'}>${m.active?'Revoke mandate':'Revoked'}</button></div>`:'<div class="empty">Mandates let your agent act automatically. Create one above.</div>'}`};
function publish(id){const a=S.agents.find(x=>x.id==id),p=+$('#mp').value,d=+$('#md').value,f=+$('#mf').value,t=+$('#mt').value,ms=$('#mm').value.split(',').map(x=>x.trim()).filter(Boolean),e=m=>$('#err').textContent=m;
if(!(p>0&&d>0))return e('Limits must be greater than zero.');if(d<p)return e(`Conflict: the daily budget (${R(d)}) is lower than the per-transaction limit (${R(p)}). Raise the daily budget or lower the limit.`);
if(!ms.length)return e('Add at least one allowed merchant.');if(!(f>=0&&t<=24&&f<t))return e('Hours must run from 0 to 24, with the start before the end.');
mk(a,p,d,ms,f,t);pick('agent',id)}
V.tx=()=>`<h2>Transactions and sandbox</h2><div class="box"><h3>Send a signed request</h3><div class="f"><label>Agent<select id="ta">${S.agents.map(a=>`<option value="${a.id}">${esc(a.name)}`).join('')}<option value="rogue">Unregistered agent (rogue)</select></label><label>Merchant<input id="tm" value="Amazon Fresh"></label><label>Amount (₹)<input id="tn" type="number" value="2000"></label><label>Hour (0 to 23)<input id="th" type="number" value="14"></label></div><div class="row"><button class="p" onclick="send()">Send request</button><button onclick="demo()">Run guided demo</button></div></div>${S.txs.length?S.txs.slice().reverse().map(txRow).join(''):'<div class="empty">No activity<br><br><button class="p" onclick="demo()">Run a sandbox demo</button></div>'}`;
async function send(){const v=$('#ta').value;const t=await submit(v=='rogue'?'rogue':+v,$('#tm').value.trim(),+$('#tn').value,+$('#th').value);pick('tx',t.id)}
V.inc=()=>`<h2>Incidents</h2>${S.inc.length?S.inc.slice().reverse().map(i=>{const t=S.txs[i.tx-1];return `<div class="row2" onclick="pick('inc',${i.id})"><b>#${i.id}</b><span class="m">${i.tags.join(', ')}: ${esc(t.agent)}, ${R(t.amount)}</span>${b(t.decision)}</div>`}).join(''):'<div class="empty">No incidents<br><br><button class="p" onclick="demo()">Run a sandbox test</button></div>'}`;
V.admin=()=>{
if(S.role=='Consumer')return `<h2>Admin</h2><div class="empty">Switch the role in the header to Bank Admin or Operator to open this view.</div>`;
if(S.role=='Bank Admin'){const fl={all:()=>1,high:t=>t.band=='High',held:t=>t.decision=='HOLD',rej:t=>t.decision=='REJECT'},L=S.txs.filter(fl[S.gf]);
 return `<h2>Bank authorization gateway</h2><div class="row">${[['all','All'],['high','High risk'],['held','Held'],['rej','Rejected']].map(([k,l])=>`<button class="${S.gf==k?'p':''}" onclick="S.gf='${k}';render()">${l}</button>`).join('')}</div>${L.slice().reverse().map(txRow).join('')||'<div class="empty">No pending decisions</div>'}<p class="m">Select a decision to accept the recommendation or override it with an audit note.</p>`}
if(!S.metrics)S.metrics=evalModel();const M=S.metrics,avg=S.txs.length?Math.round(S.txs.reduce((a,t)=>a+t.lat,0)/S.txs.length):0;
return `<h2>Operator console</h2><div class="box"><h3>Risk thresholds</h3><div class="f"><label>Step-up (hold) at score<input id="thh" type="number" value="${S.th.hi}"></label><label>Flag for review at score<input id="thm" type="number" value="${S.th.med}"></label></div><button class="p" onclick="S.th.hi=+$('#thh').value;S.th.med=Math.min(+$('#thm').value,S.th.hi);render()">Save thresholds</button></div>
<div class="box"><h3>Isolation Forest v${S.ver} on synthetic labeled test set (${M.n} requests, 20% anomalous)</h3><div class="sc-w"><table><tr><th>Precision</th><th>Recall</th><th>F1</th><th>False-positive rate</th><th>Avg decision latency</th></tr><tr><td>${(M.pr*100).toFixed(1)}%</td><td>${(M.rc*100).toFixed(1)}%</td><td>${(M.f1*100).toFixed(1)}%</td><td>${(M.fpr*100).toFixed(1)}%</td><td>${avg} ms</td></tr></table></div><div class="row"><button onclick="S.ver++;S.metrics=evalModel();for(const k in S.mand)S.mand[k].forest=train();render()">Approve retraining</button></div><p class="m">Model output is one risk signal. Identity checks and mandate rules stay deterministic.</p></div>
<div class="box"><h3>Tamper-evident audit chain</h3>${S.txs.map(t=>`<div class="fr"><span>#${t.id} ${t.decision}</span><code>${t.hash}</code></div>`).join('')||'<p class="m">No events yet.</p>'}</div>`};
/* Rail */
function rail(){const s=S.sel;if(!s)return `<div class="box"><h3>Details</h3><p class="m">Select an agent, transaction or incident to see its details here.</p></div>`;
if(s.t=='agent'){const a=S.agents.find(x=>x.id==s.id),m=S.mand[a.id];return `<div class="box"><h3>${esc(a.name)} ${b(a.status)}</h3><p class="m">${a.type} agent</p><p class="m">Identity fingerprint</p><code>${a.fp}</code><details><summary>Cryptographic details</summary><p class="m">ECDSA P-256 with SHA-256. The public key is registered; the private key stays with the agent (here, in your browser tab).</p></details><p>${m?sumText(m):'No mandate yet.'}</p><div class="row"><button class="p" onclick="S.mAgent=${a.id};go('mand')">${m?'Edit mandate':'Create mandate'}</button><button onclick="rotate(${a.id})">Rotate key</button><button class="d" onclick="revoke(${a.id})">Revoke agent</button></div></div>`}
if(s.t=='tx'){const t=S.txs[s.id-1],c=S.role=='Consumer',bk=S.role=='Bank Admin';return `<div class="box"><h3>Transaction #${t.id} ${b(t.decision)} ${t.flag?b('FLAG'):''}</h3><p>${esc(t.why)}</p><p class="m">${esc(t.agent)} to ${esc(t.merchant)} for ${R(t.amount)} at ${t.hour}:00</p>
<h4>Risk score ${t.score} of 100 (${t.band})</h4><div class="bar"><i style="width:${t.score}%"></i></div>${t.fac.map(f=>`<div class="fr"><span>${esc(f[0])}</span><b>+${f[1]}</b></div>`).join('')||'<p class="m">No risk signals.</p>'}
<details><summary>Decision timeline and evidence</summary><div class="tl">${t.aud.map(x=>`<div>${esc(x)}</div>`).join('')}</div><p class="m">Signature ${t.sigOK?'verified':'failed'}, fingerprint ${t.fp}, decided in ${t.lat} ms.</p><code>audit chain ${t.hash}</code></details>
${t.final?`<p><b>Final:</b> ${esc(t.final)}</p>`:''}
${c&&t.decision=='HOLD'&&!t.final?`<div class="row"><button class="p" onclick="resolve(${t.id},1,'Customer')">Approve</button><button onclick="resolve(${t.id},0,'Customer')">Reject</button></div>`:''}
${bk?`<label>Audit note (required to override)<input id="gn"></label><div class="row"><button class="p" onclick="gw(${t.id},'accept')">Accept recommendation</button><button onclick="gw(${t.id},'allow')">Override: allow</button><button onclick="gw(${t.id},'reject')">Override: reject</button><button onclick="gw(${t.id},'step-up')">Require step-up</button></div><div id="gerr" class="err"></div>`:''}
${c&&t.aid?`<div class="row"><button class="d" onclick="revoke(${t.aid})">Revoke agent</button></div>`:''}</div>`}
const i=S.inc[s.id-1],t=S.txs[i.tx-1];return `<div class="box"><h3>Incident #${i.id}</h3><p>${i.tags.map(x=>`<span class="b HOLD">${x}</span>`).join(' ')}</p><p>${esc(t.why)}</p><p><b>Recommended:</b> ${esc(i.rem)}</p><div class="tl">${t.aud.map(x=>`<div>${esc(x)}</div>`).join('')}</div>
<div class="row"><button onclick="out(${i.id},'csv')">Export CSV</button><button onclick="out(${i.id},'gh')">GitHub issue</button><button onclick="pick('tx',${t.id})">Open transaction</button></div>${S.out?`<label>Copy and paste where needed<textarea readonly onfocus="this.select()">${esc(S.out)}</textarea></label>`:''}</div>`}
function out(id,k){const i=S.inc[id-1],t=S.txs[i.tx-1];S.out=k=='csv'?`incident,tags,agent,merchant,amount,hour,decision,score,reason\n${i.id},"${i.tags.join('; ')}","${t.agent}","${t.merchant}",${t.amount},${t.hour},${t.decision},${t.score},"${t.why.replace(/"/g,"'")}"`:`Title: [AgentShield] ${i.tags.join(', ')} on request #${t.id}\n\n**Decision:** ${t.decision} (risk ${t.score}/100)\n**Reason:** ${t.why}\n**Timeline:**\n${t.aud.map(x=>'- '+x).join('\n')}\n**Audit chain:** ${t.hash}\n**Recommended:** ${i.rem}`;render()}
/* Actions */
function go(v){S.view=v;S.sel=null;render()}
function pick(t,id){S.sel={t,id};S.out='';render();if(innerWidth<900)$('#rail').scrollIntoView({block:'nearest'})}
function resolve(id,ok,who){const t=S.txs[id-1];t.final=`${who} ${ok?'approved':'rejected'} the held request`;if(ok&&t.aid){S.ledger[t.aid]=(S.ledger[t.aid]||0)+t.amount}t.aud.push(t.final);render()}
function gw(id,act){const t=S.txs[id-1],n=$('#gn').value.trim();if(act!='accept'&&!n)return $('#gerr').textContent='Add an audit note to override or require step-up.';
t.final=act=='accept'?`Bank accepted the ${t.decision} recommendation`:`Bank override (${act}): ${n}`;if(act=='allow'&&t.aid)S.ledger[t.aid]=(S.ledger[t.aid]||0)+t.amount;t.aud.push(t.final);render()}
function revoke(id){S.agents.find(a=>a.id==id).status='Revoked';render()}
async function rotate(id){const a=S.agents.find(x=>x.id==id),k=await genKey();a.keys=k.k;a.fp=k.fp;render()}
async function demo(){S.view='tx';let n='ShopperBot',i=1;while(S.agents.some(a=>a.name==n))n='ShopperBot'+(++i);
const k=await genKey(),a={id:++S.n,name:n,type:'Shopping',keys:k.k,fp:k.fp,status:'Registered',seen:[]};S.agents.push(a);mk(a,5000,15000,['Amazon Fresh','Uber','IRCTC','Swiggy'],6,23);S.mAgent=a.id;render();
for(const [g,m,x,h] of [[a.id,'Amazon Fresh',2000,14],['rogue','Amazon Fresh',3000,14],[a.id,'Amazon Fresh',20000,14],[a.id,'Swiggy',4800,22]]){await sleep(800);const t=await submit(g,m,x,h);pick('tx',t.id)}}
function render(){$('#nav').innerHTML=[['home','Home'],['agents','Agents'],['mand','Mandates'],['tx','Transactions'],['inc','Incidents'],['admin','Admin']].map(([k,l])=>`<button class="nv ${S.view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#main').innerHTML=V[S.view]();$('#rail').innerHTML=rail()}
render();
</script></body></html>
